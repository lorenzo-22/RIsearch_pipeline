name: CI

# When to run: on every pull request, and on direct pushes to main.
on:
  pull_request:
  push:
    branches: [main]

# If new commits arrive on the same PR/branch while a run is in progress,
# cancel the older run — no point testing superseded code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      # Core install only (risearch is in default-groups but needs an SSH key
      # CI does not have). --frozen installs exactly what uv.lock pins.
      - run: uv sync --frozen --no-group risearch
      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --no-group risearch
      # pyrefly config lives in [tool.pyrefly] (checks src/, treats the
      # `risearch` group as Any so this passes without it installed).
      - name: Pyrefly type check
        run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --frozen resolves the correct per-version dependency set from the
      # single universal uv.lock for this matrix.python-version.
      - run: uv sync --frozen --no-group risearch
      # risearch-dependent tests auto-skip (pytest.importorskip) since the
      # `risearch` group is not installed here (no SSH key in CI).
      - name: Pytest
        run: uv run pytest -q

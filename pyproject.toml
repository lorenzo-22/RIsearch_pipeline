[project]
name = "risearch-pipeline"
version = "0.1.0"
description = "Pipeline for the analysis of the results of the RIsearch project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "biopython",
  "httpx",
  "loguru",
  "matplotlib>=3.7.0",
  "muscle>=0.0.4",
  "ncls>=0.0.63",
  "numpy==2.4.0",
  "omegaconf>=2.3.0",
  "pandas>=2.0.0",
  "polars",
  "pyarrow",
  "rich>=14.3.0",
  "seaborn>=0.12.0",
  "typer",
  "viennaRNA==2.7.2",
]

[project.scripts]
gw = "RIsearch_pipeline.cli:entrypoint"
risearch-pipeline = "RIsearch_pipeline.cli:entrypoint"

[dependency-groups]
dev = [
  "pre-commit",
  "pyrefly",
  "pytest",
  "ruff",
  "scalene>=2.1.3",
  "ty",
]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true

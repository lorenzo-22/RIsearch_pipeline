[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riot-rna"
version = "0.1.0"
description = "RIOT — siRNA off-target discovery pipeline for analyzing RIsearch2 predictions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Lorenzo Favaro", email = "lorenzo@rth.dk" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "biopython",
  "loguru",
  "ncls>=0.0.63",
  "numpy>=2.4.1",
  "omegaconf>=2.3.0",
  "polars[rtcompat]>=1.0",
  "pyarrow",
  "pyyaml",
  "rich>=14.3.0",
  "typer",
  "viennaRNA==2.7.2",
]

[project.urls]
Homepage = "https://github.com/lorenzo-22/RIsearch_pipeline"
Repository = "https://github.com/lorenzo-22/RIsearch_pipeline"
Issues = "https://github.com/lorenzo-22/RIsearch_pipeline/issues"

[project.scripts]
riot = "riot.cli:entrypoint"

[dependency-groups]
# The `risearch` PyO3 bindings are only needed for the in-process `index` /
# `search` commands. Core off-targets/accessibility work without them.
#
# This is a PEP 735 dependency group, NOT an optional extra, and deliberately so:
# a `git+ssh` direct reference inside `[project.optional-dependencies]` is copied
# verbatim into the wheel/sdist `Requires-Dist`, and PyPI rejects distributions
# whose metadata carries a direct URL. A dependency group is resolver-only — it
# never reaches published metadata — so the core package stays PyPI-publishable
# while this dependency remains a private git repo.
#
#   uv sync                   -> core only (no SSH key, no Rust toolchain)
#   uv sync --group risearch  -> adds the in-process index/search bindings
#
# `risearch` is licensed BUSL-1.1 (source-available, not open source) — see the
# License section of README.md. Swap this for a normal PyPI version pin if it is
# ever published there.
#
# The commit is pinned rather than tracking a branch so installs are
# reproducible; bump it deliberately, after verifying the bindings still match
# and checking what search results do.
#
# NOTE on `penalty`: RIOT does not pass it, so it inherits upstream's default.
# That default changed 3.5 -> 0.0 in 3.0.0a2, and 0.0.0a1 applied it with the
# wrong sign (a flat -2x penalty that *improved* the energy). Net effect of the
# 0.0.0a1 -> 3.0.0a2 bump on our fixtures: E_min -40.2956 -> -33.2956, 800 ->
# 700 hits. At penalty=0 the two versions are bit-identical, so this is a
# correctness fix, not drift. See saiden89/risearch#27.
risearch = [
  "risearch @ git+ssh://git@github.com/saiden89/risearch.git@1a03a473c58047dbb3895ec3fd6734968e2e979a#subdirectory=bindings/python",
]
dev = [
  "pre-commit",
  # Pinned: pyrefly is the blocking type-check gate; an unpinned upgrade could
  # flag new errors and redden CI on an unrelated `uv lock`. Bump deliberately.
  "pyrefly==0.64.1",
  "pytest",
  "ruff",
  "scalene>=2.1.3",
  "ty",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyrefly]
# scripts/ is not packaged (no console script, excluded from the wheel), but it is
# user-facing orchestration and was previously outside every gate — type-checked
# here so it cannot drift.
project-includes = ["src", "scripts"]
# Type-check against the lowest supported version to catch newer-stdlib usage.
python-version = "3.11"
# `risearch` is an optional dependency group (`uv sync --group risearch`), imported lazily.
# Treat it as `Any` so type-checking passes whether or not it is installed.
replace-imports-with-any = ["risearch"]

[tool.hatch.build.targets.wheel]
packages = ["src/riot"]

[tool.uv]
package = true

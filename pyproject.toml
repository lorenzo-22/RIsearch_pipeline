[project]
name = "risearch-pipeline"
version = "0.1.0"
description = "Pipeline for the analysis of the results of the RIsearch project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "biopython",
  "loguru",
  "ncls>=0.0.63",
  "numpy>=2.4.1",
  "omegaconf>=2.3.0",
  "polars[rtcompat]>=1.0",
  "pyarrow",
  "rich>=14.3.0",
  # TODO: drop @feature/polars-lts-support ref after PR #4 merges into main
  "risearch @ git+ssh://git@github.com/saiden89/risearch.git@feature/polars-lts-support#subdirectory=risearch-python",
  "seaborn>=0.12.0",
  "typer",
  "viennaRNA==2.7.2",
]

[project.scripts]
gw = "RIsearch_pipeline.cli:entrypoint"
risearch-pipeline = "RIsearch_pipeline.cli:entrypoint"

[dependency-groups]
dev = [
  "pre-commit",
  "pyrefly",
  "pytest",
  "ruff",
  "scalene>=2.1.3",
  "ty",
]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true

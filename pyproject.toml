[project]
name = "risearch-pipeline"
version = "0.1.0"
description = "Pipeline for the analysis of the results of the RIsearch project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "loguru",
  "numpy==2.4.0",
  "omegaconf>=2.3.0",
  "polars",
  "rich>=14.3.0",
  "typer",
  "viennaRNA==2.7.2"
]

[project.scripts]
gw = "RIsearch_pipeline.cli:entrypoint"
risearch-pipeline = "RIsearch_pipeline.cli:entrypoint"

[dependency-groups]
dev = ["pre-commit", "pyrefly", "pytest", "ruff", "ty"]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true

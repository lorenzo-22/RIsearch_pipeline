# RIsearch Pipeline Configuration Example
# You can place this file anywhere. Run with:
# risearch-pipeline --config path/to/this/config.yaml

# -----------------------------------------------------------------------------
# COMMAND SELECTION
# Options: "off-targets" or "accessibility"
command: off-targets
# -----------------------------------------------------------------------------
# Global Options
verbose: false # Enable detailed debug logging

# -----------------------------------------------------------------------------
# OFF-TARGETS CONFIGURATION
# Required if command is "off-targets"
# -----------------------------------------------------------------------------
off_targets:
  # [REQUIRED] Path to RIsearch2 output predictions (TSV)
  risearch_file: ../tests/off-targets/single/input/risearch_siRNAID.out

  # [OPTIONAL] Transcriptome annotation (GTF/GFF3)
  transcriptome: ../tests/off-targets/single/input/expression_data.bed

  # [OPTIONAL] Feature type to filter from GTF (default: exon)
  feature: exon

  # [OPTIONAL] Expression metric column in GTF attributes (default: RPKM)
  expression_metric: RPKM

  # [OPTIONAL] Output file path
  output: ../tests/off-targets/single/output/tw.results

  # [OPTIONAL] Accessibility Data
  # Provide EITHER accessibility_dir (pre-computed) OR fasta (compute on-the-fly)
  accessibility_dir: ../tests/off-targets/single/input/accessibility
  #fasta: tests/input/genome.fa

  # [OPTIONAL] On-Target Calculation (for Probability P(OT))
  on_target: ../tests/off-targets/single/input/onTarget.fa
  query: ../tests/off-targets/single/input/siRNA.fa
  on_target_expression: 1000.0
  on_target_risearch_file: ../tests/off-targets/single/input/risearch_siRNAID_only.out
  on_target_accessibility: ../tests/off-targets/single/input/accessibility/onTarget_plus.access.npy

  # [OPTIONAL] Analysis Flags
  legacy_format: true # Save in old pipeline format (.results)
  detailed_report: true # Save detailed probability breakdown per transcript
  sense_only: true # Filter for sense strand only
  type: tw # Transcriptome-wide mode (match by transcript ID)

# -----------------------------------------------------------------------------
# ACCESSIBILITY CONFIGURATION
# Required if command is "accessibility"
# -----------------------------------------------------------------------------
accessibility:
  # [REQUIRED] Genome FASTA file
  fasta: ../tests/off-targets/single/input/transcripts.fa

  # [REQUIRED] Output directory for accessibility profiles
  output: ../tests/off-targets/single/output/accessibility

  # Parameters
  window: 80
  span: 40
  unpaired: 30

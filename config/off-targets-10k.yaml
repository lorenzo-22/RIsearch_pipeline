# RIsearch Pipeline Configuration - 10k siRNA Benchmark
# Run with:
#   risearch-pipeline --config config/tests/off-targets-10k.yaml
# Profile with:
#   uv run scalene run risearch-pipeline --config config/tests/off-targets-10k.yaml
#   uv run scalene view --cli

# -----------------------------------------------------------------------------
# COMMAND SELECTION
command: off-targets

# -----------------------------------------------------------------------------
# Global Options
verbose: false

# -----------------------------------------------------------------------------
# OFF-TARGETS CONFIGURATION (10k siRNA benchmark)
# -----------------------------------------------------------------------------
off_targets:
  # [REQUIRED] Path to RIsearch2 output predictions (10,000 siRNAs, 600k rows)
  risearch_file: tests/off-targets/10k_dataset/risearch_10k.out

  # [REQUIRED] Output file path
  output: tests/off-targets/10k_dataset/results_10k.tsv

  # [OPTIONAL] Analysis Flags
  legacy_format: false
  detailed_report: false
  sense_only: false
  type: tw # Transcriptome-wide mode

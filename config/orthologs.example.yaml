# RIsearch Pipeline - Orthologs Configuration Example
# Run with: risearch-pipeline --config config/orthologs.example.yaml

# -----------------------------------------------------------------------------
# COMMAND SELECTION
# -----------------------------------------------------------------------------
command: orthologs

# -----------------------------------------------------------------------------
# ORTHOLOGS CONFIGURATION
# -----------------------------------------------------------------------------
orthologs:
  # [REQUIRED] Path to file containing target gene symbol (e.g., PSMC2)
  target_gene: ../tests/dsRNA/data/input/target_gene.txt

  # [REQUIRED] Path to file containing list of species scientific names
  species_list: ../tests/dsRNA/data/input/species_list.txt

  # [OPTIONAL] Output directory
  output: ../tests/dsRNA/data/output

  # [REQUIRED] Email for NCBI API (E-utilities)
  email: your.email@example.com

  # [OPTIONAL] OrthoDB Taxonomy ID for Insecta (default: 50557)
  insecta_level: 50557

  # [OPTIONAL] Analysis Flags
  plot_lengths: true # Generate ortholog sequence length box plot
  run_msa: true # Run Multiple Sequence Alignment (requires MUSCLE)
